name: mtbreaker
# NOTE: For NVIDIA RTX 5060 Ti (Blackwell, sm_120), CUDA 12.8+ is required.
# Blackwell architecture support was added in CUDA Toolkit 12.8.
#
# Installation options:
# 1. Use conda with pytorch-cuda=12.8 (when available)
# 2. Use pip with nightly PyTorch wheels: pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cu128
channels:
  - pytorch-nightly  # Use nightly channel for latest Blackwell support
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch  # Latest nightly with sm_120 support
  - pytorch-cuda=12.8  # CUDA 12.8+ required for Blackwell (sm_120)
  - pip
  - pip:
      # Core Deep Learning
      - transformers==4.57.1
      - accelerate==0.34.2
      - peft==0.12.0
      - trl==0.8.6

      # Data Processing
      - datasets==2.21.0
      - numpy==1.26.4
      - pandas==2.3.3
      - pyarrow==22.0.0

      # Evaluation & Scoring
      - unbabel-comet==2.2.2
      - sentencepiece==0.1.99
      - sacremoses==0.1.1
      - sacrebleu==2.5.1
      - torchmetrics==0.10.3

      # Experiment Tracking (optional)
      - wandb==0.23.0
      - pytorch-lightning==2.5.6

      # Utilities
      - tqdm==4.67.1
      - pyyaml==6.0.3
      - jinja2==3.1.6
      - requests==2.32.5
      - pillow==11.3.0
